spring:
  application:
    name: photo-map-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  servlet:
    multipart:
      enabled: false

folder:
  path: /tmp/test-images
  pins: /tmp/test-images
  
jwt:
  secret: test-only-secret-not-for-production-use-32bytes
  expiration-days: 7