spring:
  application:
    name: photo-map
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/travel_map}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org.springframework.web: debug

folder:
  path: "C:/Users/Cosati/OneDrive/Documentos/mapImages"
  pins: "C:/Users/Cosati/OneDrive/Imagens/pins"
  
jwt:
  secret: ${JWT_SECRET:this-is-a-local-only-dev-secret-change-me-32-bytes-min}
  expiration-days: 7